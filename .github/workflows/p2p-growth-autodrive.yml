name: P2P Growth Auto Run

on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/p2p-growth-autodrive.yml]

permissions:
  contents: read
  id-token: write

concurrency:
  group: p2p-growth-autodrive
  cancel-in-progress: false

jobs:
  run-growth:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Run protected P2P growth cycle
        shell: bash
        run: |
          token_response="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=p2p-growth-command")"
          oidc_token="$(jq -er '.value' <<<"$token_response")"
          response="$(curl --fail --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $oidc_token" \
            --header "Content-Type: application/json" \
            https://p2p-outreach-command.boateng29.chatgpt.site/api/growth/cron)"
          jq -e '(.ok == true) and ((.emailsSent != null) or (.skipped != null))' <<<"$response"
          jq '{ok, skipped, processed, discovered, qualified, discarded, expired, emailsSent, nextRunAt}' <<<"$response"
