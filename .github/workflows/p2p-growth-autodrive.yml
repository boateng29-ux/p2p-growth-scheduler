name: P2P Growth Auto Run

on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/p2p-growth-autodrive.yml]

permissions:
  contents: read
  id-token: write

concurrency:
  group: p2p-growth-autodrive
  cancel-in-progress: false

jobs:
  run-growth:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      P2P_GROWTH_URL: https://p2p-outreach-command.boateng29.chatgpt.site/api/growth/cron
    steps:
      - name: Run protected P2P growth cycle
        id: growth
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "P2P Growth AutoSEO V20 runner starting at $(date -u +%Y-%m-%dT%H:%M:%SZ)"

          token_response="$(curl \
            --fail-with-body \
            --silent \
            --show-error \
            --connect-timeout 15 \
            --max-time 45 \
            --retry 3 \
            --retry-delay 5 \
            --retry-all-errors \
            -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=p2p-growth-command")"

          oidc_token="$(jq -er '.value | select(type == "string" and length > 20)' <<<"$token_response")"

          response_file="$(mktemp)"
          http_code="$(curl \
            --silent \
            --show-error \
            --output "$response_file" \
            --write-out '%{http_code}' \
            --connect-timeout 20 \
            --max-time 180 \
            --retry 3 \
            --retry-delay 10 \
            --retry-all-errors \
            --request POST \
            --header "Authorization: Bearer $oidc_token" \
            --header "Content-Type: application/json" \
            --header "X-P2P-Runner-Version: AUTOSEO-V20" \
            "$P2P_GROWTH_URL")"

          response="$(cat "$response_file")"
          rm -f "$response_file"

          if [[ "$http_code" -lt 200 || "$http_code" -ge 300 ]]; then
            echo "Growth endpoint returned HTTP $http_code"
            printf '%s\n' "$response"
            exit 1
          fi

          jq -e '
            (.ok == true)
            and (
              (.emailsSent != null)
              or (.skipped != null)
              or (.processed != null)
              or (.discovered != null)
            )
          ' <<<"$response" >/dev/null

          health="$(jq -c '{
            ok,
            skipped,
            processed,
            discovered,
            qualified,
            discarded,
            expired,
            emailsSent,
            nextRunAt,
            engineState: (.engineState // .state // "completed"),
            failures: (.failures // .errors // 0)
          }' <<<"$response")"

          echo "health=$health" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$health" | jq .

          {
            echo "### P2P AutoSEO V20 Growth Cycle"
            echo
            echo '| Metric | Result |'
            echo '|---|---:|'
            echo "| Engine | $(jq -r '.engineState' <<<"$health") |"
            echo "| Processed | $(jq -r '.processed // 0' <<<"$health") |"
            echo "| Discovered | $(jq -r '.discovered // 0' <<<"$health") |"
            echo "| Qualified | $(jq -r '.qualified // 0' <<<"$health") |"
            echo "| Discarded | $(jq -r '.discarded // 0' <<<"$health") |"
            echo "| Expired | $(jq -r '.expired // 0' <<<"$health") |"
            echo "| Emails sent | $(jq -r '.emailsSent // 0' <<<"$health") |"
            echo "| Failures | $(jq -r '.failures // 0' <<<"$health") |"
            echo "| Next run | $(jq -r '.nextRunAt // "not supplied"' <<<"$health") |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Enforce healthy completion
        shell: bash
        env:
          HEALTH: ${{ steps.growth.outputs.health }}
        run: |
          set -Eeuo pipefail
          jq -e '
            (.ok == true)
            and ((.failures // 0) == 0)
          ' <<<"$HEALTH" >/dev/null
